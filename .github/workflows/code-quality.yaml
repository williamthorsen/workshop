# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Code quality checks

# Note: This workflow will be automatically skipped if the commit message includes
# any of the following strings: [skip ci], [ci skip], [no ci], [skip actions], or [actions skip]

on:
  push:
    branches:
      - main
      - next

  pull_request:
    branches:
      - main
      - next

  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    uses: williamthorsen/.github/.github/workflows/code-quality-pnpm-workflow.yaml@v8
    # The legs together run every step of `nmr ci`. A leg invokes neither `ci` nor `check:strict`,
    # so it runs their hooks itself: `ci:pre`, `ci:post`, and `check:content` for
    # `check:strict:post`. `ci:pre` shares the build leg because it must verify the kit bundles
    # before `build:post` recompiles them on the same runner. Lint runs alone as the longest check.
    with:
      check-commands: >-
        [
          { "name": "build", "command": "pnpm exec nmr ci:pre && pnpm exec nmr build && pnpm exec nmr ci:post" },
          { "name": "lint", "command": "pnpm exec nmr lint:strict" },
          { "name": "static", "command": "pnpm exec nmr typecheck && pnpm exec nmr fmt:check && pnpm exec nmr check:content" },
          { "name": "test", "command": "pnpm exec nmr test" }
        ]
