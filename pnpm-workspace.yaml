# Don't install declared peers: Each demo repository installs demo-tools' aidemo peer itself.
autoInstallPeers: false

allowBuilds:
  cpu-features: false
  esbuild: true
  lefthook: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  ssh2: false
  unrs-resolver: true

catalog:
  '@tandryukha/aidemo': 0.20.6
  '@vitest/coverage-v8': 5.1.1
  '@williamthorsen/nmr': 2.3.1
  '@williamthorsen/readout': 0.2.0
  '@williamthorsen/toolbelt.arrays': 7.0.0
  '@williamthorsen/toolbelt.atlassian': 0.9.4
  '@williamthorsen/toolbelt.cli': 0.14.0
  '@williamthorsen/toolbelt.errors': 0.11.4
  '@williamthorsen/toolbelt.filesystem': 0.12.0
  '@williamthorsen/toolbelt.git': 0.7.11
  '@williamthorsen/toolbelt.nodejs': 4.2.5
  '@williamthorsen/toolbelt.numbers': 9.0.0
  '@williamthorsen/toolbelt.objects': 5.0.0
  '@williamthorsen/toolbelt.packaging': 0.10.0
  '@williamthorsen/toolbelt.secrets': 0.8.0
  '@williamthorsen/toolbelt.strings': 11.0.0
  '@williamthorsen/toolbelt.terminal': 0.3.2
  '@williamthorsen/toolbelt.testing': 0.9.0
  '@williamthorsen/toolbelt.vitest': 0.14.0
  esbuild: 0.28.2
  kokoro-js: 1.2.1
  typescript: 6.0.3
  vite: 8.3.8
  vitest: 5.1.1
  yaml: 2.9.1
  zod: 4.6.7

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@williamthorsen/*'
  - codeassembly
  - codeassembly-guidance
  - readyup
  - v11y-check

packages:
  - packages/*

savePrefix: ''

# Refuse a release whose provenance is weaker than that of an earlier release of the same package,
# which can signal a compromised publisher.
trustPolicy: no-downgrade
