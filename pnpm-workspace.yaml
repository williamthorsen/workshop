packages:
  - packages/*

allowBuilds:
  esbuild: true
  lefthook: true
  unrs-resolver: true

catalog:
  '@williamthorsen/toolbelt.errors': 0.8.2
  '@williamthorsen/toolbelt.filesystem': 0.9.2
  '@williamthorsen/toolbelt.packaging': 0.6.2
  '@williamthorsen/toolbelt.strings': 8.0.2
  '@williamthorsen/toolbelt.testing': 0.6.2
  '@williamthorsen/toolbelt.vitest': 0.10.2
  esbuild: 0.28.2
  zod: 4.6.5

savePrefix: ''

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@williamthorsen/*'
  - codeassembly
  - codeassembly-lifecycle
  - readyup
  - v11y-check
