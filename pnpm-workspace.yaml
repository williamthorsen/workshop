packages:
  - packages/*

allowBuilds:
  esbuild: true
  lefthook: true
  unrs-resolver: true

catalog:
  '@williamthorsen/toolbelt.errors': 0.8.0
  '@williamthorsen/toolbelt.filesystem': 0.9.0
  '@williamthorsen/toolbelt.packaging': 0.6.0
  '@williamthorsen/toolbelt.strings': 8.0.0
  '@williamthorsen/toolbelt.testing': 0.6.0
  '@williamthorsen/toolbelt.vitest': 0.10.0
  esbuild: 0.28.2
  zod: 4.5.4

savePrefix: ''

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@williamthorsen/*'
  - codeassembly
  - codeassembly-lifecycle
  - readyup
  - v11y-check
