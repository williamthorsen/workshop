packages:
  - packages/*

allowBuilds:
  esbuild: true
  lefthook: true
  unrs-resolver: true

catalog:
  '@vitest/coverage-v8': 5.0.5
  '@williamthorsen/nmr': 0.52.0
  '@williamthorsen/toolbelt.atlassian': 0.7.1
  '@williamthorsen/toolbelt.cli': 0.6.0
  '@williamthorsen/toolbelt.errors': 0.8.4
  '@williamthorsen/toolbelt.filesystem': 0.9.4
  '@williamthorsen/toolbelt.git': 0.6.1
  '@williamthorsen/toolbelt.nodejs': 4.0.0
  '@williamthorsen/toolbelt.numbers': 7.2.4
  '@williamthorsen/toolbelt.packaging': 0.6.4
  '@williamthorsen/toolbelt.secrets': 0.5.0
  '@williamthorsen/toolbelt.strings': 8.0.4
  '@williamthorsen/toolbelt.terminal': 0.2.1
  '@williamthorsen/toolbelt.testing': 0.7.0
  '@williamthorsen/toolbelt.vitest': 0.12.0
  esbuild: 0.28.2
  typescript: 6.0.3
  vite: 8.3.5
  vitest: 5.0.5
  yaml: 2.9.1
  zod: 4.6.7

savePrefix: ''

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@williamthorsen/*'
  - codeassembly
  - codeassembly-guidance
  - readyup
  - v11y-check

# Refuse a release whose provenance is weaker than that of an earlier release of the same package,
# which can signal a compromised publisher.
trustPolicy: no-downgrade
