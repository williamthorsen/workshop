packages:
  - packages/*

allowBuilds:
  esbuild: true
  lefthook: true

catalog:
  '@williamthorsen/toolbelt.errors': 0.3.0
  '@williamthorsen/toolbelt.packaging': 0.3.0
  zod: 4.4.3

savePrefix: ''

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@williamthorsen/*'
  - codeassembly
  - codeassembly-lifecycle
  - readyup
  - v11y-check
