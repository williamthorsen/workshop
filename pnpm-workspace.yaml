# Don't install declared peers: Each demo repository installs demo-tools' aidemo peer itself.
autoInstallPeers: false

allowBuilds:
  esbuild: true
  lefthook: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  unrs-resolver: true

catalog:
  '@tandryukha/aidemo': 0.20.6
  '@vitest/coverage-v8': 5.1.0
  '@williamthorsen/nmr': 2.2.3
  '@williamthorsen/readout': 0.2.0
  '@williamthorsen/toolbelt.arrays': 6.5.6
  '@williamthorsen/toolbelt.atlassian': 0.9.3
  '@williamthorsen/toolbelt.cli': 0.13.0
  '@williamthorsen/toolbelt.errors': 0.11.3
  '@williamthorsen/toolbelt.filesystem': 0.11.4
  '@williamthorsen/toolbelt.git': 0.7.10
  '@williamthorsen/toolbelt.nodejs': 4.2.4
  '@williamthorsen/toolbelt.numbers': 8.1.3
  '@williamthorsen/toolbelt.objects': 4.4.6
  '@williamthorsen/toolbelt.packaging': 0.9.3
  '@williamthorsen/toolbelt.secrets': 0.7.3
  '@williamthorsen/toolbelt.strings': 10.0.1
  '@williamthorsen/toolbelt.terminal': 0.3.2
  '@williamthorsen/toolbelt.testing': 0.8.7
  '@williamthorsen/toolbelt.vitest': 0.13.8
  esbuild: 0.28.2
  kokoro-js: 1.2.1
  typescript: 6.0.3
  vite: 8.3.8
  vitest: 5.1.0
  yaml: 2.9.1
  zod: 4.6.7

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@williamthorsen/*'
  - codeassembly
  - codeassembly-guidance
  - readyup
  - v11y-check

packages:
  - packages/*

savePrefix: ''

# Refuse a release whose provenance is weaker than that of an earlier release of the same package,
# which can signal a compromised publisher.
trustPolicy: no-downgrade
