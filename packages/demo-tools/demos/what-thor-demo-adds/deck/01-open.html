<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>What thor-demo adds</title>
    <link rel="stylesheet" href="/deck/deck.css" />
    <link rel="stylesheet" href="adds.css" />
    <script src="/deck/deck.js" defer></script>
  </head>
  <body>
    <main class="adds">
      <header>
        <p class="kicker">@williamthorsen/demo-tools</p>
        <h1>What thor-demo adds to aidemo</h1>
      </header>
      <div class="figure" id="open-figure">
        <div class="ring" id="ring"></div>
        <span id="ring-label" class="mono beat-in" data-beat="shown" tabindex="0">thor-demo</span>
        <svg class="wires" id="open-wires" viewBox="0 0 1200 480" aria-hidden="true">
          <line x1="600" y1="180" x2="210" y2="250" />
          <line x1="600" y1="180" x2="600" y2="250" />
          <line x1="600" y1="180" x2="990" y2="250" />
        </svg>
        <div class="card" id="core">
          <h2>aidemo</h2>
          <span class="sub">Storyboard in, narrated MP4 out</span>
        </div>
        <div class="card tile" id="tile-config">
          <span class="number">1</span>
          <h2>Per-repository configuration</h2>
          <span class="sub">One environment for a shell and an agent</span>
        </div>
        <div class="card tile" id="tile-archive">
          <span class="number">2</span>
          <h2>Archived takes</h2>
          <span class="sub">Every take kept, with its provenance</span>
        </div>
        <div class="card tile" id="tile-voice">
          <span class="number">3</span>
          <h2>Voice clone</h2>
          <span class="sub">The presenter’s voice, on this machine</span>
        </div>
      </div>
    </main>
    <nav><a class="next" href="02-config.html">Next</a></nav>
  </body>
</html>
